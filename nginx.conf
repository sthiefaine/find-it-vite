server {
    listen 80;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml audio/wav;

    # Nginx keeps the existing public ports; the room server stays internal.
    location = /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        add_header Cache-Control "no-store" always;
    }

    # Fichiers générés par Vite (nom avec hash) : cache long
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images / sons : vraie 404 si le fichier n'existe pas
    location /assets/ {
        try_files $uri =404;
    }

    # PWA : service worker et manifeste toujours revalidés, sinon les mises à jour restent bloquées
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /icons/ {
        try_files $uri =404;
    }

    # SPA : toutes les routes renvoient index.html (équivalent du vercel.json)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
